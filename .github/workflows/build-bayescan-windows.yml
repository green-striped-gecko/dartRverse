# One-off build of a self-contained BayeScan 2.1 for Windows, for
# binaries/bayescan_windows.zip (used by gl.download.binary("bayescan") and
# gl.run.bayescan in dartR.popgen). The official
# BayeScan2.1_win32bits_cmd_line.exe needs pthreadGC2.dll and mingwm10.dll,
# which the official distribution does not include.
on:
  push:
    branches: [build-bayescan-windows]

name: build-bayescan-windows

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libgomp
            unzip
            zip

      - name: Download the BayeScan 2.1 source
        run: |
          curl -sSfL -o BayeScan2.1.zip https://cmpg.unibe.ch/software/BayeScan/files/BayeScan2.1.zip
          echo "c6bbc52a5a6a30e895951faf2bd6291ca47fdccdc708e693fce02389548d5547  BayeScan2.1.zip" | sha256sum -c
          unzip -q BayeScan2.1.zip

      - name: Build a static bayescan.exe
        run: |
          cd BayeScan2.1/source
          g++ --version | head -1
          # MinGW declares the POSIX function fstat(), which clashes with
          # BayeScan's global variable fstat. This header, included before
          # each source file, loads the system headers BayeScan uses and then
          # renames BayeScan's variable.
          printf '%s\n' algorithm fstream iomanip iostream limits.h math.h \
            omp.h sstream stdio.h stdlib.h string.h time.h vector sys/stat.h \
            | sed 's/.*/#include <&>/' > ../prelude.h
          echo '#define fstat bayescan_fstat' >> ../prelude.h
          cat ../prelude.h
          # read_discarded() (option -d) has no return statement. GCC 8 and
          # later treat the end of the function as unreachable and compile
          # its read loop into an endless loop, so bayescan -d never
          # finishes. This adds the missing "return 0;".
          perl -0pi -e 's/(discarded_loci\[locus-1\]=true;\r?\n    \}\r?\n)\}/$1    return 0;\r\n}/' read_write.cpp
          sed -n '/^int read_discarded/,/^}/p' read_write.cpp
          sed -n '/^int read_discarded/,/^}/p' read_write.cpp | grep -q "return 0;"
          # C++14: from C++17 std::beta clashes with BayeScan's global beta
          g++ -std=gnu++14 -O3 -fopenmp -static -Werror=return-type -include ../prelude.h \
            -o bayescan.exe start.cpp beta.cpp dirichlet.cpp RJupdates.cpp \
            MHupdates.cpp likelihood.cpp read_write.cpp anyoption.cpp
          objdump -p bayescan.exe | grep "DLL Name"
          # only Windows system DLLs may be imported
          if objdump -p bayescan.exe | grep "DLL Name" | grep -viE "kernel32|msvcrt|advapi32|user32|ws2_32|api-ms-win"; then
            echo "bayescan.exe needs a non-system DLL"; exit 1
          fi

      - name: Package bayescan_windows.zip
        run: |
          mkdir -p pkg/bayescan
          cp BayeScan2.1/source/bayescan.exe BayeScan2.1/binaries/COPYING pkg/bayescan/
          gccv=$(g++ --version | head -1)
          cat > pkg/bayescan/README.txt <<EOF
          BayeScan 2.1 (Foll and Gaggiotti 2008), https://cmpg.unibe.ch/software/BayeScan/
          Distributed under the GNU General Public License v3 (see COPYING). The source
          code is in BayeScan2.1.zip at the URL above (folder source/).

          This binary was built from the BayeScan 2.1 source on GitHub Actions
          (windows-latest, MSYS2 MINGW64, $gccv), 64-bit, linked
          statically so that no MinGW DLLs are needed:
            g++ -std=gnu++14 -O3 -fopenmp -static -include prelude.h -o bayescan.exe
              start.cpp beta.cpp dirichlet.cpp RJupdates.cpp MHupdates.cpp
              likelihood.cpp read_write.cpp anyoption.cpp
          prelude.h includes the system headers BayeScan uses and then
          #define fstat bayescan_fstat, because the MinGW headers declare a
          function fstat() that clashes with BayeScan's variable of that name.

          Modification (2026-10-14): the function read_discarded() in
          read_write.cpp had no return statement; "return 0;" was added at its
          end. Without it, GCC 8 and later compile the loop that reads the file
          given with option -d into an endless loop, and bayescan -d never
          finishes. Nothing else in the source was changed.
          EOF
          cd pkg && zip -q -X -r ../bayescan_windows.zip bayescan

      # PowerShell does not have the MSYS2 folders on PATH, so this fails if
      # the executable needs a MinGW DLL
      - name: Run bayescan.exe outside MSYS2
        shell: pwsh
        run: |
          Expand-Archive bayescan_windows.zip -DestinationPath run
          # each run takes about 15 s on a Mac; stop it after 5 minutes
          function Run-Bayescan($name, $extra) {
            New-Item -ItemType Directory $name | Out-Null
            $a = @("BayeScan2.1\input_examples\test_SNPs.txt", "-od", $name, "-o", "r",
                   "-threads", "2", "-n", "500", "-thin", "2", "-nbp", "5",
                   "-pilot", "500", "-burn", "500") + $extra
            $t = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process run\bayescan\bayescan.exe -ArgumentList $a -NoNewWindow -PassThru `
                   -RedirectStandardOutput "$name.log" -RedirectStandardError "$name.err"
            $null = $p.Handle
            if (-not $p.WaitForExit(300000)) {
              $p.Kill(); Get-Content "$name.log" -Tail 3 | Out-Host
              Write-Host "$name timed out after 300 s"; exit 1
            }
            Write-Host "$name finished in $([int]$t.Elapsed.TotalSeconds) s, exit status $($p.ExitCode)"
            Get-Content "$name.log" -TotalCount 1 | Out-Host
            if ($p.ExitCode -ne 0) { Get-Content "$name.err" | Out-Host; exit 1 }
            return ((Get-Content "$name\r_fst.txt").Count - 1)
          }
          $n = Run-Bayescan "out" @()
          "rows: $n"
          if ($n -ne 1000) { exit 1 }
          # -d reads a list of loci to discard (6 of the 1000 in the example)
          $n = Run-Bayescan "outd" @("-d", "BayeScan2.1\input_examples\discarded.txt")
          "rows with -d: $n"
          if ($n -ne 994) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: bayescan_windows
          path: bayescan_windows.zip

  test-gl-run-bayescan:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: green-striped-gecko/dartR.popgen
          ref: dev

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::testthat
            github::green-striped-gecko/dartR.base@dev
            github::green-striped-gecko/dartR.data@dev

      - uses: actions/download-artifact@v4
        with:
          name: bayescan_windows

      - name: Run the gl.run.bayescan tests with the new bayescan.exe
        shell: Rscript {0}
        run: |
          d <- file.path(tempdir(), "dl")
          dir.create(d)
          unzip("bayescan_windows.zip", exdir = d)
          Sys.setenv(BAYESCAN_DIR = file.path(d, "bayescan"))
          devtools::load_all()
          testthat::test_file("tests/testthat/test-gl.run.bayescan.R",
                              reporter = "summary", stop_on_failure = TRUE)

  # The Linux binary in dartRverse is the official BayeScan2.1_linux64bits,
  # built with an old GCC. Check that its -d option finishes.
  linux-official-d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run the dartRverse bayescan_linux.zip with and without -d
        run: |
          curl -sSfL -o BayeScan2.1.zip https://cmpg.unibe.ch/software/BayeScan/files/BayeScan2.1.zip
          echo "c6bbc52a5a6a30e895951faf2bd6291ca47fdccdc708e693fce02389548d5547  BayeScan2.1.zip" | sha256sum -c
          unzip -q BayeScan2.1.zip
          curl -sSfL -o bayescan_linux.zip https://raw.githubusercontent.com/green-striped-gecko/dartRverse/dev/binaries/bayescan_linux.zip
          unzip -q bayescan_linux.zip
          ex=BayeScan2.1/input_examples
          for d in no yes; do
            mkdir out_$d
            args="$ex/test_SNPs.txt -od out_$d -o r -threads 2 -n 500 -thin 2 -nbp 5 -pilot 500 -burn 500"
            [ $d = yes ] && args="$args -d $ex/discarded.txt"
            SECONDS=0
            timeout 300 ./bayescan/bayescan $args > out_$d.log 2>&1 || { echo "-d $d: failed or timed out"; tail -3 out_$d.log; exit 1; }
            echo "-d $d: $SECONDS s, $(( $(wc -l < out_$d/r_fst.txt) - 1 )) rows"
          done
          [ $(( $(wc -l < out_yes/r_fst.txt) - 1 )) -eq 994 ]
